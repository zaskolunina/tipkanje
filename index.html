<!DOCTYPE html>
<html lang="hr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Brzi Prsti: Školska utrka u tipkanju</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Google Fonts: Inter & Fredoka -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Fredoka:wght@500;600;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Inter', sans-serif; }
        .font-fun { font-family: 'Fredoka', cursive, sans-serif; }
    </style>
</head>
<body class="bg-slate-900 text-slate-100 min-h-screen flex flex-col selection:bg-amber-400 selection:text-slate-950">

    <!-- Prilagođeni Modal (zamjena za alert/confirm) -->
    <div id="custom-modal" class="fixed inset-0 bg-black/75 z-50 hidden flex items-center justify-center p-4 backdrop-blur-sm">
        <div class="bg-slate-800 border border-slate-700 rounded-3xl max-w-md w-full p-6 shadow-2xl text-center">
            <div id="modal-icon" class="text-4xl mb-3">📢</div>
            <h3 id="modal-title" class="font-fun text-2xl font-bold text-amber-400 mb-2">Obavijest</h3>
            <p id="modal-message" class="text-slate-300 mb-6 text-sm leading-relaxed"></p>
            <button onclick="closeModal()" class="w-full py-3.5 bg-gradient-to-r from-indigo-500 to-purple-600 hover:from-indigo-600 hover:to-purple-700 font-bold rounded-2xl text-white shadow-lg transition-all">U redu</button>
        </div>
    </div>

    <!-- Glavni spremnik aplikacije -->
    <main class="flex-1 flex flex-col">
        <div id="app-container" class="flex-1 flex flex-col">
            <!-- Dinamički sadržaj -->
        </div>
    </main>

    <!-- Footer -->
    <footer class="py-4 text-center text-xs text-slate-500 border-t border-slate-800/80">
        Brzi Prsti • Interaktivno školsko natjecanje u tipkanju u stvarnom vremenu
    </footer>

    <!-- Firebase SDK (Modular 11.6.1) -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js";
        import { getAuth, signInAnonymously, signInWithCustomToken } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-auth.js";
        import { getFirestore, doc, setDoc, getDoc, updateDoc, onSnapshot, collection, getDocs, deleteDoc } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js";

        // Globalne postavke i Firebase
        const appId = typeof __app_id !== 'undefined' ? __app_id : 'skolska-utrka-tipkanja-v2';
        const firebaseConfig = typeof __firebase_config !== 'undefined' ? JSON.parse(__firebase_config) : {
            apiKey: "AIzaSyDummyKeyForLocalTesting12345",
            authDomain: "dummy.firebaseapp.com",
            projectId: "dummy-project"
        };

        let app, db, auth, currentUser = null;
        let unsubscribeRoom = null;
        let unsubscribePlayers = null;
        let typingInterval = null;

        // Stanje aplikacije
        let state = {
            view: 'home', // 'home', 'teacher_setup', 'teacher_dashboard', 'student_join', 'student_lobby', 'race', 'results'
            role: '', // 'teacher' ili 'student'
            roomCode: '',
            nickname: '',
            avatar: '🚗',
            playerId: '',
            roomData: null,
            players: [],
            typedText: '',
            raceStartTime: null,
            isFinished: false,
            finalWpm: 0,
            finalTime: 0,
            finalAccuracy: 100
        };

        // Inicijalizacija Firebase-a
        async function initApp() {
            try {
                app = initializeApp(firebaseConfig);
                db = getFirestore(app);
                auth = getAuth(app);

                if (typeof __initial_auth_token !== 'undefined' && __initial_auth_token) {
                    await signInWithCustomToken(auth, __initial_auth_token);
                } else {
                    await signInAnonymously(auth);
                }
                currentUser = auth.currentUser;
                state.playerId = currentUser ? currentUser.uid : 'user_' + Math.random().toString(36).substring(2, 9);
            } catch (e) {
                console.log("Firebase demo mod:", e);
                state.playerId = 'user_' + Math.random().toString(36).substring(2, 9);
            }
            render();
        }

        // Modali
        window.showModal = function(title, message, icon = '📢') {
            document.getElementById('modal-title').textContent = title;
            document.getElementById('modal-message').textContent = message;
            document.getElementById('modal-icon').textContent = icon;
            document.getElementById('custom-modal').classList.remove('hidden');
        };

        window.closeModal = function() {
            document.getElementById('custom-modal').classList.add('hidden');
        };

        // Glavni render
        function render() {
            const container = document.getElementById('app-container');
            container.innerHTML = '';

            switch(state.view) {
                case 'home':
                    container.innerHTML = renderHomeView();
                    break;
                case 'teacher_setup':
                    container.innerHTML = renderTeacherSetupView();
                    break;
                case 'teacher_dashboard':
                    container.innerHTML = renderTeacherDashboardView();
                    break;
                case 'student_join':
                    container.innerHTML = renderStudentJoinView();
                    break;
                case 'student_lobby':
                    container.innerHTML = renderStudentLobbyView();
                    break;
                case 'race':
                    container.innerHTML = renderRaceView();
                    // Fokusiraj input kad krene utrka
                    setTimeout(() => {
                        const inp = document.getElementById('race-input');
                        if (inp) inp.focus();
                    }, 100);
                    break;
                case 'results':
                    container.innerHTML = renderResultsView();
                    break;
            }
        }

        // --- POGLEDI (VIEWS) ---

        function renderHomeView() {
            return `
                <div class="flex-1 flex flex-col items-center justify-center p-6 text-center">
                    <div class="max-w-xl w-full bg-slate-800/90 backdrop-blur border border-slate-700 rounded-3xl p-8 shadow-2xl">
                        <div class="text-6xl mb-4 animate-bounce">🏎️💨</div>
                        <h1 class="font-fun text-4xl sm:text-5xl font-extrabold text-transparent bg-clip-text bg-gradient-to-r from-amber-400 via-orange-400 to-rose-400 mb-3">
                            Brzi Prsti
                        </h1>
                        <p class="text-slate-300 mb-8 text-sm sm:text-base leading-relaxed">
                            Zabavno školsko natjecanje u brzom tipkanju. Utrkuj se svojim likom do cilja točnim i brzim prepisivanjem teksta na hrvatskom jeziku!
                        </p>
                        <div class="flex flex-col sm:flex-row gap-4 justify-center">
                            <button onclick="setRole('teacher')" class="flex-1 py-4 px-6 bg-gradient-to-r from-indigo-600 to-blue-600 hover:from-indigo-500 hover:to-blue-500 text-white font-bold rounded-2xl shadow-lg transition-all transform hover:-translate-y-0.5 flex items-center justify-center gap-3 text-lg">
                                <span>👨‍🏫</span> Učiteljski način
                            </button>
                            <button onclick="setRole('student')" class="flex-1 py-4 px-6 bg-gradient-to-r from-emerald-600 to-teal-600 hover:from-emerald-500 hover:to-teal-500 text-white font-bold rounded-2xl shadow-lg transition-all transform hover:-translate-y-0.5 flex items-center justify-center gap-3 text-lg">
                                <span>🎒</span> Učenički način
                            </button>
                        </div>
                    </div>
                </div>
            `;
        }

        function renderTeacherSetupView() {
            const defaultText = "Danas je u našoj školi održano veliko natjecanje u brzom tipkanju. Učenici s velikim uzbuđenjem prate svoje autiće na ekranu dok vješto tipkaju svako slovo. Računala su nam postala glavni prijatelji u učenju i igri. Tko će prvi stići do cilja i osvojiti zlatnu medalju?";
            return `
                <div class="flex-1 flex flex-col items-center justify-center p-6">
                    <div class="max-w-2xl w-full bg-slate-800 border border-slate-700 rounded-3xl p-8 shadow-2xl">
                        <div class="flex items-center justify-between mb-6">
                            <h2 class="font-fun text-2xl font-bold text-amber-400">Postavke učiteljske sobe</h2>
                            <button onclick="goHome()" class="text-slate-400 hover:text-white text-sm bg-slate-700/80 px-4 py-2 rounded-xl transition">← Natrag</button>
                        </div>
                        <div class="space-y-6">
                            <div>
                                <label class="block text-sm font-semibold text-slate-300 mb-2">Tekst za prepisivanje (na hrvatskom):</label>
                                <textarea id="setup-text" rows="6" class="w-full bg-slate-900 border border-slate-700 rounded-2xl p-4 text-slate-100 focus:outline-none focus:ring-2 focus:ring-amber-400 text-sm leading-relaxed">${defaultText}</textarea>
                            </div>
                            <button onclick="createRoom()" class="w-full py-4 bg-gradient-to-r from-amber-500 to-orange-500 hover:from-amber-400 hover:to-orange-400 text-slate-950 font-extrabold rounded-2xl shadow-lg text-lg transition transform hover:-translate-y-0.5">
                                Generiraj kod i pokreni sobu 🚀
                            </button>
                        </div>
                    </div>
                </div>
            `;
        }

        function renderTeacherDashboardView() {
            const room = state.roomData || {};
            const code = state.roomCode;
            const players = state.players;
            const isRunning = room.status === 'running';
            const isFinished = room.status === 'finished';

            return `
                <div class="flex-1 flex flex-col p-4 sm:p-8 max-w-6xl mx-auto w-full">
                    <!-- Zaglavlje ploče -->
                    <div class="bg-slate-800 border border-slate-700 rounded-3xl p-6 shadow-xl mb-6 flex flex-col md:flex-row items-center justify-between gap-6">
                        <div class="text-center md:text-left">
                            <span class="text-xs uppercase tracking-wider text-slate-400 font-semibold">Kod za pristup učenicima</span>
                            <div class="font-fun text-5xl font-extrabold text-amber-400 tracking-widest mt-1">${code}</div>
                        </div>
                        <div class="flex flex-wrap items-center justify-center gap-3">
                            <div class="bg-slate-900 px-4 py-3 rounded-2xl border border-slate-700 text-center">
                                <span class="block text-xs text-slate-400">Prijavljeno učenika</span>
                                <span class="font-bold text-xl text-emerald-400">${players.length} / 25+</span>
                            </div>
                            ${!isRunning && !isFinished ? `
                                <button onclick="startRace()" class="py-3 px-6 bg-emerald-500 hover:bg-emerald-400 text-slate-950 font-bold rounded-2xl shadow-lg transition text-base flex items-center gap-2">
                                    <span>🏁</span> Pokreni utrku
                                </button>
                            ` : ''}
                            ${isRunning ? `
                                <div class="py-3 px-6 bg-amber-500/20 border border-amber-500/50 text-amber-300 font-bold rounded-2xl animate-pulse">
                                    Utrka je u tijeku... 🏎️
                                </div>
                            ` : ''}
                            <button onclick="resetRoom()" class="py-3 px-5 bg-rose-600/20 hover:bg-rose-600/40 border border-rose-500/50 text-rose-300 font-bold rounded-2xl transition text-sm">
                                Resetiraj sobu
                            </button>
                            <button onclick="goHome()" class="py-3 px-4 bg-slate-700 hover:bg-slate-600 text-slate-300 font-semibold rounded-2xl transition text-sm">
                                Izađi
                            </button>
                        </div>
                    </div>

                    <!-- Staza u stvarnom vremenu -->
                    <div class="bg-slate-800 border border-slate-700 rounded-3xl p-6 shadow-xl flex-1 flex flex-col">
                        <h3 class="font-fun text-xl font-bold text-slate-200 mb-4 flex items-center justify-between">
                            <span>Poredak natjecatelja uživo</span>
                            <span class="text-xs font-normal text-slate-400">Ažurira se automatski</span>
                        </h3>
                        
                        <div class="flex-1 space-y-4 overflow-y-auto max-h-[500px] pr-2">
                            ${players.length === 0 ? `
                                <div class="text-center py-20 text-slate-500">
                                    <div class="text-4xl mb-2 animate-spin">⏳</div>
                                    <p>Čekanje da se učenici pridruže sa kodom <span class="text-amber-400 font-bold">${code}</span>...</p>
                                </div>
                            ` : ''}
                            ${players.sort((a,b) => (b.progress || 0) - (a.progress || 0)).map((p, idx) => {
                                const prog = Math.min(100, Math.max(0, p.progress || 0));
                                const isFinishedPlayer = prog >= 100;
                                return `
                                    <div class="bg-slate-900/80 border border-slate-700/60 rounded-2xl p-4 relative overflow-hidden">
                                        <div class="flex items-center justify-between mb-2 text-sm z-10 relative">
                                            <div class="flex items-center gap-2">
                                                <span class="font-bold text-slate-400">#${idx+1}</span>
                                                <span class="text-2xl">${p.avatar || '🚗'}</span>
                                                <span class="font-bold text-slate-200">${escapeHtml(p.nickname)}</span>
                                                ${isFinishedPlayer ? '<span class="bg-emerald-500/20 text-emerald-400 border border-emerald-500/40 text-xs px-2 py-0.5 rounded-full font-bold">Cilj! 🏆</span>' : ''}
                                            </div>
                                            <div class="flex items-center gap-4 text-xs font-semibold text-slate-400">
                                                <span>WPM: <strong class="text-amber-400">${p.wpm || 0}</strong></span>
                                                <span>Točnost: <strong class="text-emerald-400">${p.accuracy || 100}%</strong></span>
                                                <span>${Math.round(prog)}%</span>
                                            </div>
                                        </div>
                                        <!-- Staza -->
                                        <div class="w-full bg-slate-950 rounded-full h-4 relative overflow-hidden border border-slate-800">
                                            <div class="bg-gradient-to-r from-indigo-500 to-amber-400 h-full rounded-full transition-all duration-300" style="width: ${prog}%"></div>
                                            <div class="absolute top-0 bottom-0 text-lg flex items-center transition-all duration-300" style="left: calc(${prog}% - 14px);">
                                                ${p.avatar || '🚗'}
                                            </div>
                                        </div>
                                    </div>
                                `;
                            }).join('')}
                        </div>
                    </div>
                </div>
            `;
        }

        function renderStudentJoinView() {
            return `
                <div class="flex-1 flex flex-col items-center justify-center p-6">
                    <div class="max-w-md w-full bg-slate-800 border border-slate-700 rounded-3xl p-8 shadow-2xl">
                        <div class="flex items-center justify-between mb-6">
                            <h2 class="font-fun text-2xl font-bold text-emerald-400">Pridruži se utrci</h2>
                            <button onclick="goHome()" class="text-slate-400 hover:text-white text-sm bg-slate-700/80 px-3 py-1.5 rounded-xl transition">← Natrag</button>
                        </div>
                        <div class="space-y-4">
                            <div>
                                <label class="block text-sm font-semibold text-slate-300 mb-1">4-znamenkasti kod sobe:</label>
                                <input type="text" id="join-code" maxlength="4" placeholder="npr. 4821" class="w-full bg-slate-900 border border-slate-700 rounded-2xl p-4 text-center text-2xl font-extrabold tracking-widest text-amber-400 focus:outline-none focus:ring-2 focus:ring-emerald-400">
                            </div>
                            <div>
                                <label class="block text-sm font-semibold text-slate-300 mb-1">Tvoje ime ili nadimak:</label>
                                <input type="text" id="join-nickname" maxlength="20" placeholder="npr. Ana 5.b" class="w-full bg-slate-900 border border-slate-700 rounded-2xl p-4 text-slate-100 focus:outline-none focus:ring-2 focus:ring-emerald-400 font-semibold">
                            </div>
                            <div>
                                <label class="block text-sm font-semibold text-slate-300 mb-2">Izaberi svoj avatar:</label>
                                <div class="grid grid-cols-5 gap-3" id="avatar-selector">
                                    ${['🚗', '🚀', '🚲', '🏃', '⭐', '🦖', '⚡', '🤖', '🐱', '🔥'].map((av, idx) => `
                                        <button type="button" onclick="selectAvatar('${av}')" class="avatar-btn p-3 bg-slate-900 border-2 ${idx === 0 ? 'border-emerald-400 bg-emerald-500/10' : 'border-slate-700'} rounded-2xl text-2xl hover:border-emerald-400 transition transform hover:scale-105" data-avatar="${av}">
                                            ${av}
                                        </button>
                                    `).join('')}
                                </div>
                            </div>
                            <button onclick="joinRoom()" class="w-full py-4 bg-gradient-to-r from-emerald-500 to-teal-500 hover:from-emerald-400 hover:to-teal-400 text-slate-950 font-extrabold rounded-2xl shadow-lg text-lg transition transform hover:-translate-y-0.5 mt-2">
                                Uđi u čekaonicu 🏁
                            </button>
                        </div>
                    </div>
                </div>
            `;
        }

        function renderStudentLobbyView() {
            const players = state.players;

            return `
                <div class="flex-1 flex flex-col items-center justify-center p-6">
                    <div class="max-w-xl w-full bg-slate-800 border border-slate-700 rounded-3xl p-8 shadow-2xl text-center">
                        <div class="text-5xl mb-3 animate-pulse">${state.avatar}</div>
                        <h2 class="font-fun text-3xl font-bold text-slate-100 mb-1">Pozdrav, ${escapeHtml(state.nickname)}!</h2>
                        <p class="text-slate-400 text-sm mb-6">U sobi si <span class="text-amber-400 font-bold">${state.roomCode}</span>. Čekamo učitelja da pokrene utrku...</p>
                        
                        <div class="bg-slate-900/80 border border-slate-700 rounded-2xl p-4 mb-6 text-left">
                            <h4 class="text-xs font-semibold text-slate-400 uppercase tracking-wider mb-3">Prijavljeni natjecatelji (${players.length}):</h4>
                            <div class="flex flex-wrap gap-2 max-h-40 overflow-y-auto">
                                ${players.map(p => `
                                    <div class="bg-slate-800 border border-slate-700 px-3 py-1.5 rounded-xl flex items-center gap-2 text-sm">
                                        <span>${p.avatar}</span>
                                        <span class="font-semibold text-slate-200">${escapeHtml(p.nickname)}</span>
                                    </div>
                                `).join('')}
                            </div>
                        </div>

                        <div class="animate-bounce text-emerald-400 font-semibold text-sm">
                            Uskoro krećemo, pripremi prste na tipkovnicu! ⌨️
                        </div>
                    </div>
                </div>
            `;
        }

        function renderRaceView() {
            const room = state.roomData || {};
            const targetText = room.text || '';
            const typed = state.typedText;
            
            // Bojenje teksta slovo po slovo
            let htmlText = '';
            for (let i = 0; i < targetText.length; i++) {
                if (i < typed.length) {
                    if (typed[i] === targetText[i]) {
                        htmlText += `<span class="text-emerald-400 bg-emerald-500/10">${escapeHtml(targetText[i])}</span>`;
                    } else {
                        htmlText += `<span class="text-rose-400 bg-rose-500/20 underline">${escapeHtml(targetText[i])}</span>`;
                    }
                } else if (i === typed.length) {
                    htmlText += `<span class="bg-amber-400 text-slate-950 font-bold px-0.5 rounded animate-pulse">${escapeHtml(targetText[i])}</span>`;
                } else {
                    htmlText += `<span class="text-slate-400">${escapeHtml(targetText[i])}</span>`;
                }
            }

            return `
                <div class="flex-1 flex flex-col p-4 sm:p-8 max-w-5xl mx-auto w-full justify-between">
                    <!-- Vrh: Staza svih igrača -->
                    <div class="bg-slate-800/90 border border-slate-700 rounded-3xl p-5 shadow-xl mb-6">
                        <div class="text-xs font-semibold uppercase text-slate-400 tracking-wider mb-3 flex items-center justify-between">
                            <span>Utrka u tijeku - Pozicije na stazi</span>
                            <span class="text-amber-400">Kod sobe: ${state.roomCode}</span>
                        </div>
                        <div class="space-y-3 max-h-48 overflow-y-auto pr-1">
                            ${state.players.sort((a,b) => (b.progress || 0) - (a.progress || 0)).map(p => {
                                const prog = Math.min(100, Math.max(0, p.progress || 0));
                                const isMe = p.id === state.playerId;
                                return `
                                    <div class="relative py-1">
                                        <div class="flex justify-between text-xs mb-1">
                                            <span class="font-bold ${isMe ? 'text-emerald-400' : 'text-slate-300'}">${escapeHtml(p.nickname)} ${isMe ? '(Ti)' : ''}</span>
                                            <span class="text-slate-400">${Math.round(prog)}%</span>
                                        </div>
                                        <div class="w-full bg-slate-950 rounded-full h-3 relative overflow-hidden border border-slate-800">
                                            <div class="bg-gradient-to-r from-emerald-500 to-teal-400 h-full rounded-full transition-all duration-200" style="width: ${prog}%"></div>
                                            <div class="absolute top-0 bottom-0 text-sm flex items-center transition-all duration-200" style="left: calc(${prog}% - 12px);">
                                                ${p.avatar}
                                            </div>
                                        </div>
                                    </div>
                                `;
                            }).join('')}
                        </div>
                    </div>

                    <!-- Sredina: Polje za tipkanje -->
                    <div class="bg-slate-800 border border-slate-700 rounded-3xl p-6 sm:p-8 shadow-2xl mb-6">
                        <div class="mb-4 text-xs font-semibold text-amber-400 uppercase tracking-wider">Prepiši sljedeći tekst što brže i točnije:</div>
                        <div class="bg-slate-900 border border-slate-700/80 rounded-2xl p-6 text-lg sm:text-xl font-mono leading-relaxed mb-6 select-none max-h-48 overflow-y-auto shadow-inner">
                            ${htmlText}
                        </div>
                        <div>
                            <input type="text" id="race-input" oninput="handleTyping(event)" autocomplete="off" autocapitalize="off" spellcheck="false" placeholder="Klikni ovdje i počni tipkati..." class="w-full bg-slate-950 border-2 border-emerald-500/60 focus:border-emerald-400 rounded-2xl p-4 text-lg text-slate-100 focus:outline-none shadow-lg">
                        </div>
                    </div>
                </div>
            `;
        }

        function renderResultsView() {
            return `
                <div class="flex-1 flex flex-col items-center justify-center p-6">
                    <div class="max-w-md w-full bg-slate-800 border border-slate-700 rounded-3xl p-8 shadow-2xl text-center">
                        <div class="text-6xl mb-3 animate-bounce">🏆</div>
                        <h2 class="font-fun text-3xl font-extrabold text-amber-400 mb-2">Utrka je završena!</h2>
                        <p class="text-slate-300 text-sm mb-6">Sjajan posao, <span class="font-bold text-white">${escapeHtml(state.nickname)}</span>!</p>
                        
                        <div class="grid grid-cols-3 gap-3 mb-8">
                            <div class="bg-slate-900 p-3 rounded-2xl border border-slate-700">
                                <span class="block text-xs text-slate-400 mb-1">Brzina (WPM)</span>
                                <span class="font-fun text-2xl font-extrabold text-amber-400">${state.finalWpm}</span>
                            </div>
                            <div class="bg-slate-900 p-3 rounded-2xl border border-slate-700">
                                <span class="block text-xs text-slate-400 mb-1">Vrijeme</span>
                                <span class="font-fun text-2xl font-extrabold text-emerald-400">${state.finalTime}s</span>
                            </div>
                            <div class="bg-slate-900 p-3 rounded-2xl border border-slate-700">
                                <span class="block text-xs text-slate-400 mb-1">Točnost</span>
                                <span class="font-fun text-2xl font-extrabold text-teal-400">${state.finalAccuracy}%</span>
                            </div>
                        </div>

                        <button onclick="goHome()" class="w-full py-4 bg-gradient-to-r from-indigo-500 to-purple-600 hover:from-indigo-600 hover:to-purple-700 font-bold rounded-2xl text-white shadow-lg transition-all text-lg">
                            Povratak na početak
                        </button>
                    </div>
                </div>
            `;
        }

        // --- UPRAVLJANJE LOGIKOM ---

        window.setRole = function(role) {
            state.role = role;
            if (role === 'teacher') {
                state.view = 'teacher_setup';
            } else {
                state.view = 'student_join';
            }
            render();
        };

        window.goHome = function() {
            cleanupListeners();
            state.view = 'home';
            state.roomCode = '';
            state.role = '';
            state.roomData = null;
            state.players = [];
            state.typedText = '';
            state.isFinished = false;
            render();
        };

        window.selectAvatar = function(av) {
            state.avatar = av;
            document.querySelectorAll('.avatar-btn').forEach(btn => {
                if (btn.getAttribute('data-avatar') === av) {
                    btn.classList.add('border-emerald-400', 'bg-emerald-500/10');
                    btn.classList.remove('border-slate-700');
                } else {
                    btn.classList.remove('border-emerald-400', 'bg-emerald-500/10');
                    btn.classList.add('border-slate-700');
                }
            });
        };

        // Kreiranje sobe (Učitelj)
        window.createRoom = async function() {
            const textInput = document.getElementById('setup-text');
            const text = textInput ? textInput.value.trim() : '';
            if (!text) {
                showModal('Greška', 'Molimo unesite tekst za tipkanje.', '⚠️');
                return;
            }

            const code = Math.floor(1000 + Math.random() * 9000).toString();
            state.roomCode = code;

            try {
                const roomRef = doc(db, 'artifacts', appId, 'public', 'data', `rooms_${code}`);
                await setDoc(roomRef, {
                    code: code,
                    text: text,
                    status: 'waiting',
                    createdAt: Date.now()
                });

                state.view = 'teacher_dashboard';
                setupTeacherListeners(code);
                render();
            } catch (e) {
                console.error("Greška pri stvaranju sobe:", e);
                state.roomData = { code, text, status: 'waiting' };
                state.view = 'teacher_dashboard';
                render();
            }
        };

        // Pridruživanje sobi (Učenik)
        window.joinRoom = async function() {
            const codeInput = document.getElementById('join-code');
            const nickInput = document.getElementById('join-nickname');
            const code = codeInput ? codeInput.value.trim() : '';
            const nickname = nickInput ? nickInput.value.trim() : '';

            if (!code || code.length !== 4) {
                showModal('Greška', 'Molimo unesite valjani 4-znamenkasti kod sobe.', '⚠️');
                return;
            }
            if (!nickname) {
                showModal('Greška', 'Molimo unesite svoje ime ili nadimak.', '⚠️');
                return;
            }

            state.roomCode = code;
            state.nickname = nickname;

            try {
                const roomRef = doc(db, 'artifacts', appId, 'public', 'data', `rooms_${code}`);
                const roomSnap = await getDoc(roomRef);

                if (!roomSnap.exists()) {
                    showModal('Greška', 'Soba s tim kodom ne postoji. Provjerite kod kod učitelja.', '❌');
                    return;
                }

                state.roomData = roomSnap.data();

                const playerRef = doc(db, 'artifacts', appId, 'public', 'data', `rooms_${code}_players_${state.playerId}`);
                await setDoc(playerRef, {
                    id: state.playerId,
                    nickname: state.nickname,
                    avatar: state.avatar,
                    progress: 0,
                    wpm: 0,
                    accuracy: 100,
                    finished: false,
                    updatedAt: Date.now()
                });

                state.view = 'student_lobby';
                setupStudentListeners(code);
                render();
            } catch (e) {
                console.error("Greška pri pridruživanju:", e);
                showModal('Greška', 'Došlo je do pogreške pri spajanju na sobu.', '❌');
            }
        };

        // Pokretanje utrke
        window.startRace = async function() {
            try {
                const roomRef = doc(db, 'artifacts', appId, 'public', 'data', `rooms_${state.roomCode}`);
                await updateDoc(roomRef, {
                    status: 'running',
                    startTime: Date.now()
                });
            } catch (e) {
                console.error("Greška pri pokretanju:", e);
            }
        };

        // Resetiranje sobe
        window.resetRoom = async function() {
            try {
                const roomRef = doc(db, 'artifacts', appId, 'public', 'data', `rooms_${state.roomCode}`);
                await updateDoc(roomRef, {
                    status: 'waiting'
                });
            } catch (e) {
                console.error("Greška pri resetiranju:", e);
            }
        };

        // Slušači za učitelja
        function setupTeacherListeners(code) {
            cleanupListeners();
            const roomRef = doc(db, 'artifacts', appId, 'public', 'data', `rooms_${code}`);
            unsubscribeRoom = onSnapshot(roomRef, (docSnap) => {
                if (docSnap.exists()) {
                    state.roomData = docSnap.data();
                    render();
                }
            }, (err) => console.log(err));

            // Svi igrači koji sadrže prefiks sobe
            const playersCol = collection(db, 'artifacts', appId, 'public', 'data');
            unsubscribePlayers = onSnapshot(playersCol, (snapshot) => {
                const playersList = [];
                snapshot.forEach(docSnap => {
                    const id = docSnap.id;
                    if (id.startsWith(`rooms_${code}_players_`)) {
                        playersList.push(docSnap.data());
                    }
                });
                state.players = playersList;
                render();
            }, (err) => console.log(err));
        }

        // Slušači za učenika
        function setupStudentListeners(code) {
            cleanupListeners();
            const roomRef = doc(db, 'artifacts', appId, 'public', 'data', `rooms_${code}`);
            unsubscribeRoom = onSnapshot(roomRef, (docSnap) => {
                if (docSnap.exists()) {
                    const prevStatus = state.roomData ? state.roomData.status : 'waiting';
                    state.roomData = docSnap.data();
                    const newStatus = state.roomData.status;

                    if (prevStatus === 'waiting' && newStatus === 'running') {
                        state.view = 'race';
                        state.typedText = '';
                        state.raceStartTime = Date.now();
                        state.isFinished = false;
                    } else if (newStatus === 'waiting' && state.view === 'race') {
                        state.view = 'student_lobby';
                    }
                    render();
                }
            }, (err) => console.log(err));

            const playersCol = collection(db, 'artifacts', appId, 'public', 'data');
            unsubscribePlayers = onSnapshot(playersCol, (snapshot) => {
                const playersList = [];
                snapshot.forEach(docSnap => {
                    if (docSnap.id.startsWith(`rooms_${code}_players_`)) {
                        playersList.push(docSnap.data());
                    }
                });
                state.players = playersList;
                render();
            }, (err) => console.log(err));
        }

        function cleanupListeners() {
            if (unsubscribeRoom) { unsubscribeRoom(); unsubscribeRoom = null; }
            if (unsubscribePlayers) { unsubscribePlayers(); unsubscribePlayers = null; }
        }

        // Tipkanje učenika
        window.handleTyping = async function(e) {
            if (state.isFinished || !state.roomData || state.roomData.status !== 'running') return;

            const targetText = state.roomData.text || '';
            const val = e.target.value;
            state.typedText = val;

            // Izračun točnosti
            let errors = 0;
            for (let i = 0; i < val.length; i++) {
                if (val[i] !== targetText[i]) errors++;
            }
            const accuracy = Math.max(0, Math.round(((val.length - errors) / Math.max(1, val.length)) * 100));
            const progress = Math.min(100, (val.length / targetText.length) * 100);

            // Vrijeme i WPM
            const timeElapsed = (Date.now() - (state.raceStartTime || Date.now())) / 1000 / 60; // u minutama
            const wordsTyped = val.length / 5;
            const wpm = timeElapsed > 0 ? Math.round(wordsTyped / timeElapsed) : 0;

            // Provjera je li završio
            if (val.length >= targetText.length) {
                state.isFinished = true;
                state.finalWpm = wpm;
                state.finalTime = Math.round((Date.now() - state.raceStartTime) / 1000);
                state.finalAccuracy = accuracy;
                state.view = 'results';
                render();
            }

            // Ažuriraj u bazi
            try {
                const playerRef = doc(db, 'artifacts', appId, 'public', 'data', `rooms_${state.roomCode}_players_${state.playerId}`);
                await updateDoc(playerRef, {
                    progress: progress,
                    wpm: wpm,
                    accuracy: accuracy,
                    finished: state.isFinished,
                    updatedAt: Date.now()
                });
            } catch (err) {
                console.log("Greška pri ažuriranju napretka:", err);
            }

            render();
            // Održi fokus na inputu
            setTimeout(() => {
                const inp = document.getElementById('race-input');
                if (inp) {
                    inp.focus();
                    inp.selectionStart = inp.selectionEnd = inp.value.length;
                }
            }, 50);
        };

        // Pokreni inicijalizaciju
        window.addEventListener('DOMContentLoaded', initApp);
    </script>
</body>
</html>
