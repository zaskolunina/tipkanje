<!DOCTYPE html>
<html lang="hr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Školsko natjecanje u tipkanju</title>
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
    <style>
        :root {
            --primary: #4f46e5;
            --primary-hover: #4338ca;
            --bg-dark: #0f172a;
            --card-bg: #1e293b;
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --accent: #22c55e;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        body { background-color: var(--bg-dark); color: var(--text-main); min-height: 100vh; display: flex; flex-direction: column; align-items: center; justify-content: center; overflow-x: hidden; }

        .container { width: 100%; max-width: 900px; padding: 20px; text-align: center; }
        
        .card { background-color: var(--card-bg); border-radius: 16px; padding: 30px; box-shadow: 0 10px 25px rgba(0,0,0,0.3); margin-bottom: 20px; border: 1px solid rgba(255,255,255,0.1); }

        h1 { font-size: 2.2rem; margin-bottom: 10px; color: #818cf8; }
        p { color: var(--text-muted); margin-bottom: 20px; }

        input, textarea { width: 100%; padding: 12px 16px; border-radius: 8px; border: 1px solid #334155; background-color: #0f172a; color: white; font-size: 1rem; margin-bottom: 15px; outline: none; transition: border-color 0.2s; }
        input:focus, textarea:focus { border-color: var(--primary); }

        .btn { background-color: var(--primary); color: white; border: none; padding: 12px 24px; font-size: 1rem; font-weight: 600; border-radius: 8px; cursor: pointer; transition: background 0.2s, transform 0.1s; width: 100%; }
        .btn:hover { background-color: var(--primary-hover); }
        .btn:active { transform: scale(0.98); }
        .btn-green { background-color: var(--accent); }
        .btn-green:hover { background-color: #16a34a; }

        /* Avatari */
        .avatar-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px; margin-bottom: 20px; }
        .avatar-option { background: #0f172a; border: 2px solid #334155; border-radius: 8px; font-size: 2rem; padding: 10px; cursor: pointer; transition: all 0.2s; }
        .avatar-option.selected { border-color: var(--primary); background: rgba(79, 70, 229, 0.2); }

        /* Staza za utrku */
        .track-container { background: #090d16; border-radius: 12px; padding: 20px; margin-bottom: 20px; border: 1px solid #1e293b; position: relative; }
        .lane { border-bottom: 2px dashed #1e293b; padding: 15px 0; display: flex; align-items: center; position: relative; min-height: 60px; }
        .lane:last-child { border-bottom: none; }
        .racer-info { width: 120px; text-align: left; font-size: 0.9rem; font-weight: bold; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; padding-right: 10px; }
        .lane-track { flex-grow: 1; position: relative; height: 40px; }
        .racer-avatar { position: absolute; left: 0; top: 0; font-size: 1.8rem; transition: left 0.3s ease-out; transform: translateX(-50%); }

        /* Tipkanje */
        .text-box { background: #0f172a; border: 1px solid #334155; border-radius: 8px; padding: 20px; font-size: 1.2rem; line-height: 1.6; text-align: left; margin-bottom: 20px; user-select: none; }
        .char { color: var(--text-muted); }
        .char.correct { color: var(--accent); }
        .char.incorrect { color: #ef4444; background: rgba(239, 68, 68, 0.2); }
        .char.current { border-bottom: 2px solid var(--primary); }

        .hidden { display: none !important; }
        .room-code-display { font-size: 2.5rem; font-weight: bold; letter-spacing: 5px; color: var(--accent); margin: 15px 0; background: #0f172a; padding: 10px; border-radius: 8px; border: 1px dashed var(--accent); }
    </style>
</head>
<body>

<div class="container">
    <!-- EKRAN 1: Početni odabir (Učitelj ili Učenik) -->
    <div id="screen-home" class="card">
        <h1>Utrka u tipkanju 🚗💨</h1>
        <p>Zabavno vježbanje brzog tipkanja za učenike</p>
        <button class="btn" onclick="showScreen('screen-teacher-setup')" style="margin-bottom: 10px;">Kreiraj sobu (Učitelj)</button>
        <button class="btn btn-green" onclick="showScreen('screen-student-join')">Pridruži se utrci (Učenik)</button>
    </div>

    <!-- EKRAN 2: Učitelj postavlja sobu -->
    <div id="screen-teacher-setup" class="card hidden">
        <h1>Postavke sobe</h1>
        <p>Upiši tekst koji će učenici prepisivati:</p>
        <textarea id="teacher-text" rows="4">Danas je divan dan u školi. Učenici marljivo tipkaju na satima informatike i vježbaju brze prste na tipkovnici.</textarea>
        <button class="btn btn-green" onclick="createRoom()">Pokreni sobu</button>
        <button class="btn" style="background:#334155; margin-top:10px;" onclick="showScreen('screen-home')">Natrag</button>
    </div>

    <!-- EKRAN 3: Čekaonica za učitelja -->
    <div id="screen-teacher-lobby" class="card hidden">
        <h1>Soba je spremna!</h1>
        <p>Učenicima daj ovaj kod sobe:</p>
        <div class="room-code-display" id="display-code">1234</div>
        <p>Prijavljeni učenici: <span id="player-count">0</span></p>
        <button class="btn btn-green" onclick="startRace()">Započni utrku!</button>
    </div>

    <!-- EKRAN 4: Učenik se prijavljuje -->
    <div id="screen-student-join" class="card hidden">
        <h1>Pridruži se utrci</h1>
        <input type="text" id="student-name" placeholder="Tvoje ime i prezime" maxlength="15">
        <input type="text" id="room-code-input" placeholder="4-znamenkasti kod sobe" maxlength="4">
        
        <p style="margin-bottom: 5px; text-align: left;">Izaberi svoj lik:</p>
        <div class="avatar-grid" id="avatar-selection">
            <div class="avatar-option selected" onclick="selectAvatar('🚗')">🚗</div>
            <div class="avatar-option" onclick="selectAvatar('🏎️')">🏎️</div>
            <div class="avatar-option" onclick="selectAvatar('🚀')">🚀</div>
            <div class="avatar-option" onclick="selectAvatar('🦖')">🦖</div>
            <div class="avatar-option" onclick="selectAvatar('🦄')">🦄</div>
            <div class="avatar-option" onclick="selectAvatar('🐱')">🐱</div>
            <div class="avatar-option" onclick="selectAvatar('🤖')">🤖</div>
            <div class="avatar-option" onclick="selectAvatar('⚡')">⚡</div>
        </div>

        <button class="btn btn-green" onclick="joinRoom()">Uđi u sobu</button>
        <button class="btn" style="background:#334155; margin-top:10px;" onclick="showScreen('screen-home')">Natrag</button>
    </div>

    <!-- EKRAN 5: Glavna utrka -->
    <div id="screen-race" class="card hidden" style="max-width: 1000px;">
        <h1 style="font-size: 1.5rem; margin-bottom: 5px;">Utrka u tijeku!</h1>
        
        <div class="track-container" id="track">
            <!-- Ovdje se generiraju staze za igrače -->
        </div>

        <div class="text-box" id="target-text-display">
            <!-- Tekst za tipkanje -->
        </div>

        <input type="text" id="typing-input" placeholder="Ovdje počni prepisivati tekst..." autocomplete="off" autocapitalize="off" spellcheck="false">
    </div>
</div>

<script>
    let state = {
        role: null,
        roomCode: '',
        playerName: '',
        playerAvatar: '🚗',
        textToType: '',
        currentIndex: 0,
        isStarted: false,
        players: []
    };

    function showScreen(screenId) {
        document.querySelectorAll('.card').forEach(c => c.classList.add('hidden'));
        document.getElementById(screenId).classList.remove('hidden');
    }

    function selectAvatar(avatar) {
        state.playerAvatar = avatar;
        document.querySelectorAll('.avatar-option').forEach(el => el.classList.remove('selected'));
        event.target.classList.add('selected');
    }

    function createRoom() {
        const text = document.getElementById('teacher-text').value.trim();
        if(!text) { alert('Unesi tekst!'); return; }
        
        state.textToType = text;
        state.roomCode = Math.floor(1000 + Math.random() * 9000).toString();
        
        document.getElementById('display-code').innerText = state.roomCode;
        showScreen('screen-teacher-lobby');
        
        // Spremi u lokalnu memoriju da se učenici na istoj mreži mogu spojiti
        localStorage.setItem('race_code', state.roomCode);
        localStorage.setItem('race_text', state.textToType);
        localStorage.setItem('race_status', 'waiting');
        
        // Simulacija dolaska učenika ili detekcija
        setInterval(syncSimulation, 1000);
    }

    function joinRoom() {
        const name = document.getElementById('student-name').value.trim();
        const code = document.getElementById('room-code-input').value.trim();
        
        if(!name) { alert('Upiši svoje ime!'); return; }
        if(code !== localStorage.getItem('race_code')) { alert('Krivi kod sobe ili soba nije pronađena!'); return; }

        state.playerName = name;
        state.roomCode = code;
        state.textToType = localStorage.getItem('race_text');

        // Dodaj sebe u listu igrača
        let players = JSON.parse(localStorage.getItem('race_players') || '[]');
        if(!players.some(p => p.name === name)) {
            players.push({ name: name, avatar: state.playerAvatar, progress: 0 });
            localStorage.setItem('race_players', JSON.stringify(players));
        }

        showScreen('screen-race');
        initTypingGame();
        setInterval(updateRaceView, 500);
    }

    function startRace() {
        localStorage.setItem('race_status', 'started');
        document.getElementById('screen-teacher-lobby').classList.add('hidden');
        document.getElementById('screen-race').classList.remove('hidden');
        state.playerName = "Učitelj (Promatrač)";
        state.playerAvatar = "👑";
        initTypingGame();
        setInterval(updateRaceView, 500);
    }

    function syncSimulation() {
        if(localStorage.getItem('race_status') === 'started' && document.getElementById('screen-teacher-lobby').classList.contains('hidden') === false) {
            startRace();
        }
        let players = JSON.parse(localStorage.getItem('race_players') || '[]');
        document.getElementById('player-count').innerText = players.length;
    }

    function initTypingGame() {
        const display = document.getElementById('target-text-display');
        display.innerHTML = state.textToType.split('').map((char, i) => `<span class="char" id="char-${i}">${char}</span>`).join('');
        
        const input = document.getElementById('typing-input');
        input.value = '';
        input.focus();
        
        input.oninput = (e) => {
            const val = input.value;
            state.currentIndex = val.length;
            
            let correctAll = true;
            for(let i=0; i<state.textToType.length; i++) {
                const el = document.getElementById(`char-${i}`);
                if(i < val.length) {
                    if(val[i] === state.textToType[i]) {
                        el.className = 'char correct';
                    } else {
                        el.className = 'char incorrect';
                        correctAll = false;
                    }
                } else if(i === val.length) {
                    el.className = 'char current';
                } else {
                    el.className = 'char';
                }
            }

            // Ažuriraj napredak
            let progress = (val.length / state.textToType.length) * 100;
            if(progress > 100) progress = 100;
            
            updateMyProgress(progress);

            if(val === state.textToType) {
                input.disabled = true;
                confetti({ particleCount: 150, spread: 80, origin: { y: 0.6 } });
                alert('Bravo! Uspješno si završio utrku!');
            }
        };
    }

    function updateMyProgress(progress) {
        if(!state.playerName) return;
        let players = JSON.parse(localStorage.getItem('race_players') || '[]');
        let p = players.find(x => x.name === state.playerName);
        if(p) {
            p.progress = progress;
            localStorage.setItem('race_players', JSON.stringify(players));
        }
    }

    function updateRaceView() {
        let players = JSON.parse(localStorage.getItem('race_players') || '[]');
        const track = document.getElementById('track');
        
        track.innerHTML = players.map(p => `
            <div class="lane">
                <div class="racer-info">${p.avatar} ${p.name}</div>
                <div class="lane-track">
                    <div class="racer-avatar" style="left: ${p.progress}%;">${p.avatar}</div>
                </div>
            </div>
        `).join('');
    }
</script>

</body>
</html>
